# =====================================================================================
#  FortiGate VM (GNS3) — Firewall industrial / Conduit entre zonas
#
#  port1  -> Trunk 802.1Q hacia SW-OPERACIONES Gi0/1
#             port1.10  VL10_CAMPO      192.168.10.1/24   Niveles 0-2  (zona de control)
#             port1.20  VL20_SUPERV     192.168.20.1/24   Nivel 3      (operaciones)
#             port1.30  VL30_DMZ        192.168.30.1/24   Nivel 3.5    (DMZ industrial)
#  port2  -> IT_N4 red corporativa      10.0.0.1/24       Nivel 4      (pc-it de pruebas 10.0.0.10)
#  port3  -> WAN Internet (nodo NAT de GNS3, DHCP)  ->  AWS Academy EC2
#
#  Política por defecto: TODO denegado y registrado. Solo se abren los conduits necesarios.
#  Pegar por bloques en la CLI (consola del nodo en GNS3).
# =====================================================================================

# 0. Sistema
config system global
    set hostname "FGT-PLANTA-AGUA"
    set timezone "America/Santiago"
    set admintimeout 15
end

# 1. Interfaces
config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set alias "TRUNK_OT"
        set description "Trunk 802.1Q hacia SW-OPERACIONES"
    next
    edit "VL10_CAMPO"
        set vdom "root"
        set interface "port1"
        set vlanid 10
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set alias "N0-N2_CONTROL"
        set device-identification enable
    next
    edit "VL20_SUPERV"
        set vdom "root"
        set interface "port1"
        set vlanid 20
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set alias "N3_OPERACIONES"
    next
    edit "VL30_DMZ"
        set vdom "root"
        set interface "port1"
        set vlanid 30
        set ip 192.168.30.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set alias "N3.5_DMZ_INDUSTRIAL"
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set alias "N4_IT_CORPORATIVA"
    next
    edit "port3"
        set vdom "root"
        set mode dhcp
        set allowaccess ping
        set role wan
        set alias "WAN_INTERNET"
    next
end

# 2. Objetos de dirección
config firewall address
    edit "plc-central"
        set subnet 192.168.10.20 255.255.255.255
    next
    edit "panel-hmi-local"
        set subnet 192.168.20.10 255.255.255.255
    next
    edit "gateway-borde"
        set subnet 192.168.20.11 255.255.255.255
    next
    edit "broker-mqtt"
        set subnet 192.168.20.12 255.255.255.255
    next
    edit "puente-aws"
        set subnet 192.168.30.10 255.255.255.255
    next
    edit "RED_CAMPO_N0-N2"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "RED_SUPERVISION_N3"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "RED_DMZ_N3.5"
        set subnet 192.168.30.0 255.255.255.0
    next
    edit "RED_IT_N4"
        set subnet 10.0.0.0 255.255.255.0
    next
    # IP pública de la EC2: ACTUALIZAR en cada sesión del Learner Lab (o usar Elastic IP)
    edit "EC2_AWS"
        set subnet 3.88.0.0 255.255.255.255
        set comment "Instancia EC2 AWS Academy (Grafana/InfluxDB)"
    next
end

config firewall addrgrp
    edit "CLIENTES_MODBUS_N3"
        set member "panel-hmi-local" "gateway-borde"
        set comment "Unicos equipos de Nivel 3 autorizados a consultar el PLC"
    next
    edit "REDES_OT"
        set member "RED_CAMPO_N0-N2" "RED_SUPERVISION_N3" "RED_DMZ_N3.5"
    next
end

# 3. Servicios industriales
config firewall service custom
    edit "MODBUS_TCP"
        set category "Network Services"
        set tcp-portrange 502
        set comment "Modbus TCP (sin autenticacion ni cifrado nativo)"
    next
    edit "MQTT"
        set category "Network Services"
        set tcp-portrange 1883
    next
end

# 4. Políticas (conduits) — se evalúan de arriba hacia abajo
config firewall policy
    edit 1
        set name "N3_a_N2_MODBUS_SOLO_HMI_GATEWAY"
        set srcintf "VL20_SUPERV"
        set dstintf "VL10_CAMPO"
        set srcaddr "CLIENTES_MODBUS_N3"
        set dstaddr "plc-central"
        set action accept
        set schedule "always"
        set service "MODBUS_TCP"
        set logtraffic all
        set comments "HMI y gateway leen el PLC (FC01/FC03). La sonda-ids vigila los FC usados."
    next
    edit 2
        set name "DMZ_a_N3_MQTT_PUENTE_A_BROKER"
        set srcintf "VL30_DMZ"
        set dstintf "VL20_SUPERV"
        set srcaddr "puente-aws"
        set dstaddr "broker-mqtt"
        set action accept
        set schedule "always"
        set service "MQTT"
        set logtraffic all
        set comments "El puente solo se suscribe al broker. Nunca llega al PLC."
    next
    edit 3
        set name "DMZ_a_WAN_HTTPS_PUENTE_A_AWS"
        set srcintf "VL30_DMZ"
        set dstintf "port3"
        set srcaddr "puente-aws"
        set dstaddr "EC2_AWS"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set nat enable
        set logtraffic all
        set comments "Unica salida de la planta: telemetria cifrada TLS hacia la EC2"
    next
    edit 4
        set name "DENEGAR_IT_N4_A_OT"
        set srcintf "port2"
        set dstintf "VL10_CAMPO" "VL20_SUPERV" "VL30_DMZ"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "La red corporativa NO tiene acceso directo a la planta (ping, Modbus, etc.)"
    next
    edit 5
        set name "DENEGAR_WAN_A_OT"
        set srcintf "port3"
        set dstintf "VL10_CAMPO" "VL20_SUPERV" "VL30_DMZ" "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# Registrar también lo que cae en la denegación implícita (política 0)
config log setting
    set fwpolicy-implicit-log enable
    set local-in-allow enable
    set local-in-deny-unicast enable
end
config log memory setting
    set status enable
end

