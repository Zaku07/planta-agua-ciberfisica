#
#  En el FortiGate, ver la denegación en tiempo real:
#    diagnose debug reset
#    diagnose debug flow filter addr 192.168.10.20
#    diagnose debug flow show function-name enable
#    diagnose debug enable
#    diagnose debug flow trace start 20
#      -> "Denied by forward policy check (policy 4)"
#    diagnose debug disable
#
#  Logs de tráfico (también en GUI: Log & Report > Forward Traffic, filtro Policy ID = 4):
#    execute log filter category traffic
#    execute log filter field policyid 4
#    execute log display
#
#  Captura de paquetes Modbus permitidos:
#    diagnose sniffer packet any 'tcp port 502' 4 20
# =====================================================================================
